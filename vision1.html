<style>
  :root{
    --bg:#FFFFFF;
    --ink:#1B2430;
    --muted:#7C838C;
    --hair:#E7E9EC;
    --soft:#F4F5F7;
    --jade:#2F8F6B;
    --clay:#D14A3E;
    --sand:#C9873C;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",-apple-system,system-ui,Tahoma,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:10px}

  .app{direction:rtl;height:100dvh;min-height:520px;display:flex;flex-direction:column;overflow:hidden}

  /* ── الشريط العلوي ── */
  .hud{
    position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--hair);
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px clamp(14px,4vw,34px);
  }
  .brand h1{
    font-family:"Reem Kufi","Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;margin:0;
    font-size:clamp(18px,3.2vw,24px);font-weight:600;letter-spacing:.4px;
  }
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .meters{display:flex;gap:clamp(10px,2.4vw,22px)}
  .meter{text-align:center;line-height:1.15}
  .meter b{display:block;font-size:clamp(16px,3vw,21px);font-weight:600;font-variant-numeric:tabular-nums}
  .meter small{font-size:10.5px;color:var(--muted);letter-spacing:.5px}
  .meter.ok b{color:var(--jade)}
  .meter.no b{color:var(--clay)}

  /* ── لوح المسار ── */
  .board{position:relative;flex:1;min-height:0;padding:clamp(10px,2vh,20px) clamp(10px,2.4vw,28px) clamp(8px,1.6vh,18px)}
  .lede{
    max-width:70ch;margin:0 auto clamp(6px,1.4vh,14px);text-align:center;
    font-size:13px;line-height:1.7;color:var(--muted);
  }
  .route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .route .seg{fill:none;stroke:#AEB6BF;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:3.5 9}
  .route .seg.done{stroke:var(--jade);stroke-dasharray:none;stroke-width:4.2}
  .trail{position:relative;z-index:1;--node:110px}

  /* ── محطة على الدرب ── */
  .node{
    position:absolute;width:var(--node);display:grid;gap:5px;justify-items:center;
    background:none;border:0;padding:0;cursor:pointer;
    translate:-50% -50%;transform:rotate(var(--rot,0deg));
    transition:transform .2s ease;
  }
  .node:hover{transform:rotate(0deg)}
  .tile{
    position:relative;width:100%;aspect-ratio:1;border-radius:24px;--st:var(--node);
    background:var(--tile);border:1.5px solid var(--hair);
    display:grid;place-items:center;overflow:hidden;
    transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
  }
  .node:hover .tile{transform:translateY(-4px);border-color:var(--ink);box-shadow:0 14px 30px rgba(27,36,48,.12)}
  .tile svg{width:100%;height:100%;display:block}
  .tile .o{stroke:rgba(27,36,48,.24);stroke-width:2.4;stroke-linejoin:round}
  .num{
    position:absolute;top:6px;inset-inline-start:6px;
    min-width:22px;height:22px;padding:0 5px;border-radius:8px;

const T = STOPS.length;
const $ = id => document.getElementById(id);
const trail = $('trail'), route = $('route'), card = $('card'), scrim = $('scrim');
/* لون فاتح غير شفاف مشتق من لون المحطة: يحجب خط المسار خلفه */
const tint = (hex, a = .14) => {
  const n = parseInt(hex.slice(1), 16), m = v => Math.round(255 - (255 - v) * a);
  return "#" + [m(n >> 16), m((n >> 8) & 255), m(n & 255)].map(v => v.toString(16).padStart(2, "0")).join("");
};

const state = { score:0, right:0, wrong:0, streak:0, best:0, answered:new Array(T).fill(null), open:-1 };

/* ── بناء المحطات على شكل ثعبان ── */
const nodes = STOPS.map((s, i) => {
  const b = document.createElement('button');
  b.className = 'node';
  b.style.setProperty('--tile', tint(s.tint));
  b.setAttribute('aria-label', `${s.name} — ${s.where}`);
  b.innerHTML =
    `<span class="tile" style="background:${tint(s.tint)}">
       <span class="num">${i + 1}</span>
       <svg viewBox="0 0 200 200" aria-hidden="true">${s.art}</svg>
       <span class="stamp" hidden><b>✓</b><i>صحيح</i></span>
     </span>
     <span class="label">${s.name}<span>${s.where}</span></span>`;
  b.addEventListener('click', () => openStop(i));
  return b;
});

/* ── توزيع المحطات على درب متلوٍّ غير منتظم ── */
nodes.forEach(n => trail.appendChild(n));

function place() {
  const W = trail.clientWidth;
  const H = Math.max(240, innerHeight - trail.getBoundingClientRect().top - 14);
  trail.style.height = `${H}px`;

  /* أفضل توزيع يجعل الخمسة عشر كلها داخل الشاشة بأكبر حجم ممكن */
  let best = { node: 0 };
  for (const per of [3, 4, 5, 6, 7]) {
    const rows = Math.ceil(T / per);
    const sx = W / per, sy = H / rows;
    const node = Math.min(sx / 1.22, sy / 1.36);
    if (node > best.node) best = { node, per, rows, sx, sy };
  }
  const node = Math.max(58, Math.min(152, best.node));
  const { per, sx, sy } = best;

  trail.style.setProperty('--node', `${node}px`);
  trail.classList.toggle('tight', node < 104);
  trail.classList.toggle('bare', node < 76);

  nodes.forEach((n, i) => {
    const r = Math.floor(i / per), c = i % per;
    const inRow = Math.min(per, T - r * per);
    /* الصفوف تتبادل الاتجاه ⇒ درب يذهب ويرجع كالثعبان */
    const idx = r % 2 === 0 ? inRow - 1 - c : c;
    const x0 = (W - inRow * sx) / 2 + sx / 2;
    const jx = (((i * 53) % 11) - 5) / 5 * sx * 0.07;   /* عبث محسوب ⇒ لا يبدو جدولًا */
    const jy = (((i * 37) % 9) - 4) / 4 * sy * 0.11;
    n.style.left = `${Math.max(node / 2, Math.min(W - node / 2, x0 + idx * sx + jx))}px`;
    n.style.top = `${sy / 2 + r * sy + jy}px`;
    n.style.setProperty('--rot', `${(((i * 41) % 9) - 4) * 1.2}deg`);
  });
  requestAnimationFrame(drawRoute);
}

/* ── خط الدرب: منحنى ناعم يمرّ بكل المحطات ── */
function drawRoute() {
  const box = $('board').getBoundingClientRect();
  route.setAttribute('viewBox', `0 0 ${box.width} ${box.height}`);
  const p = nodes.map(n => {
    const t = n.querySelector('.tile').getBoundingClientRect();
    return { x: t.left - box.left + t.width / 2, y: t.top - box.top + t.height / 2 };
  });
  let d = '';
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p[i + 1];
    const c1 = { x: p1.x + (p2.x - p0.x) / 5.4, y: p1.y + (p2.y - p0.y) / 5.4 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 5.4, y: p2.y - (p3.y - p1.y) / 5.4 };
    const done = state.answered[i] === true && state.answered[i + 1] === true;
    d += `<path class="seg${done ? ' done' : ''}" d="M${p1.x} ${p1.y} C${c1.x} ${c1.y} ${c2.x} ${c2.y} ${p2.x} ${p2.y}"/>`;
  }
  route.innerHTML = d;
}

/* ── السؤال ── */
function openStop(i) {
  const s = STOPS[i];
  state.open = i;
  card.style.setProperty('--tint', s.tint);
  card.style.setProperty('--tile', tint(s.tint));
  $('qPic').style.background = tint(s.tint);
  $('qArt').innerHTML = `<svg viewBox="0 0 200 200" aria-hidden="true">${s.art}</svg>`;
  $('qTag').textContent = `${i + 1} · ${s.where}`;
  $('qText').textContent = s.q;

  const opts = $('opts');
  opts.innerHTML = '';
  const keys = ['أ', 'ب', 'ج', 'د'];
  const done = state.answered[i] !== null;
  const order = s.a.map((t, k) => ({ t, k })).sort(() => Math.random() - 0.5);
  order.forEach((o, n) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="key">${keys[n]}</span><span>${o.t}</span>`;
    if (done) {
      b.disabled = true;
      if (o.k === s.c) b.classList.add('right');
    } else {
      b.addEventListener('click', () => answer(b, o.k === s.c));
    }
    opts.appendChild(b);
  });

  const v = $('verdict');
  v.className = 'verdict';
  if (done) {
    v.classList.add('show', state.answered[i] ? 'good' : 'bad');
    $('verdictLine').textContent = state.answered[i] ? 'أجبتها صحيحة' : `الإجابة الصحيحة: ${s.a[s.c]}`;
    $('factText').textContent = s.fact;
    $('carryOn').textContent = 'إغلاق';
    ink($('qStamp'), state.answered[i], false);      /* الختم كما خُتم أول مرة */
  } else {
    $('qStamp').hidden = true;
  }
  scrim.classList.add('open');
  card.classList.add('open');
  (done ? $('carryOn') : opts.firstChild).focus();
}

/* ── ختم أخضر للصحيح وأحمر للخطأ ── */
function ink(el, correct, animate = true) {
  el.classList.remove('press');
  el.classList.toggle('no', !correct);
  el.querySelector('b').textContent = correct ? '✓' : '✕';
  el.querySelector('i').textContent = correct ? 'صحيح' : 'خطأ';
  el.hidden = false;
  if (animate) { void el.offsetWidth; el.classList.add('press'); }
}

function answer(btn, correct) {
  const i = state.open, s = STOPS[i];
  [...$('opts').children].forEach(b => {
    b.disabled = true;
    if (b.lastChild.textContent === s.a[s.c]) b.classList.add('right');
  });
  if (!correct) btn.classList.add('wrong');

  state.answered[i] = correct;
  const node = nodes[i];
  node.classList.add(correct ? 'ok' : 'no');
  ink(node.querySelector('.stamp'), correct);
  ink($('qStamp'), correct);

  const v = $('verdict');
  if (correct) {
    state.right++; state.streak++;
    state.best = Math.max(state.best, state.streak);
    const bonus = (state.streak - 1) * 25;
    state.score += 100 + bonus;
    v.classList.add('good');
    $('verdictLine').textContent = bonus
      ? `إجابة صحيحة — ‎+${100 + bonus} نقطة (متتالية ×${state.streak})`
      : 'إجابة صحيحة — ‎+100 نقطة';
  } else {
    state.wrong++; state.streak = 0;
    v.classList.add('bad');
    $('verdictLine').textContent = `ليست الإجابة — الصحيح: ${s.a[s.c]}`;
  }
  $('factText').textContent = s.fact;
  v.classList.add('show');
  const left = state.answered.filter(x => x === null).length;
  $('carryOn').textContent = left ? 'إلى المحطة التالية' : 'اعرض النتيجة';
  $('carryOn').focus();
  meters();
  drawRoute();
}

function meters() {
  $('score').textContent = state.score;
  $('right').textContent = state.right;
  $('wrong').textContent = state.wrong;
  $('prog').textContent = `${state.right + state.wrong}/${T}`;
}

function closeCard() {
  card.classList.remove('open');
  scrim.classList.remove('open');
}

$('close').addEventListener('click', closeCard);
scrim.addEventListener('click', closeCard);
$('carryOn').addEventListener('click', () => {
  closeCard();
  if (state.answered.every(x => x !== null)) { setTimeout(showFinale, 300); return; }
  for (let s = 1; s <= T; s++) {
    const c = (state.open + s) % T;
    if (state.answered[c] === null) { nodes[c].focus({ preventScroll: true }); break; }
  }
});
addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('finale').classList.contains('open')) return;
  closeCard();
});

/* ── النتيجة ── */
function showFinale() {
  $('fScore').textContent = state.score;
  $('fRight').textContent = `${state.right}/${T}`;
  $('fBest').textContent = state.best;
  const grade = state.right === T ? 'درب كامل بلا خطأ — إلمام متين بالرؤية.'
    : state.right >= 12 ? 'نتيجة عالية؛ بقيت محطات قليلة تحتاج مراجعة.'
    : state.right >= 8 ? 'منتصف الطريق ونصف زيادة — أعِد المحطات المتعثرة.'
    : 'بداية جيدة؛ اقرأ المعلومة تحت كل سؤال وأعِد الدرب.';
  $('finaleSub').textContent = grade;
  const missed = STOPS.filter((_, i) => state.answered[i] === false);
  $('fMissed').innerHTML = missed.length
    ? `<div><b>محطات تحتاج مراجعة:</b></div>` +
      missed.map(s => `<div>• ${s.name} — ${s.where}</div>`).join('')
    : '';
  $('finale').classList.add('open');
  $('again').focus();
}

$('again').addEventListener('click', () => {
  $('finale').classList.remove('open');
  Object.assign(state, { score:0, right:0, wrong:0, streak:0, best:0, open:-1 });
  state.answered = new Array(T).fill(null);
  nodes.forEach(n => {
    n.classList.remove('ok', 'no');
    const st = n.querySelector('.stamp');
    st.hidden = true;
    st.classList.remove('press', 'no');
  });
  $('qStamp').hidden = true;
  meters();
  place();
});

let rt = null;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(place, 80);
});

meters();
place();
addEventListener('load', place);
</script>
